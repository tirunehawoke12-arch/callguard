name: Build from zip
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q callguard.zip -d src
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Build APK
        working-directory: src/callguard
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CallGuard-apk
          path: src/callguard/app/build/outputs/apk/debug/app-debug.apk
